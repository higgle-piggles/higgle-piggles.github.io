    <h1>What is a carrier of a recessive trait?</h1>

    <div class="question-container button-layout">
        <button class="questionButton" onclick="checkQuestion('incorrect', this)">1. An individual who has two dominant alleles</button>
        <button class="questionButton" onclick="checkQuestion('incorrect', this)">2. An individual who expresses a recessive trait with one allele</button>
        <button class="questionButton" onclick="checkQuestion('incorrect', this)">3. An individual who has only dominant alleles</button>
        <button class="questionButton" onclick="checkQuestion('correct', this)">4. An individual who carries a recessive allele but does not express that trait</button>
