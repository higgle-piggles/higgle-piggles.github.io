<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <ul>
            <a href="index.html" style="font-family: sans-serif; color: black; text-decoration: none; margin-right: 50px;">Home</a>
            <a href="resource.html" style="font-family: sans-serif; color: black; text-decoration: none;">Resource</a>
            <a href="quizPage.html" style="font-family: sans-serif; color: black; text-decoration: none; margin-left: 50px;">Quiz</a>
        </ul>
    </nav>

    <h1>Congratulations! You finished!</h1>
    <h3 class="resultsText" id="result"></h3>
    
    <div class="results-container" style="font-family: sans-serif; margin: 30px 0; font-size: 1.5rem;">
        <h3 style="font-weight: bold;">Your Final Score: <span id="final-score" style="color: #fff;">0</span> / 20</h3>
    </div>

  
    <button class="retakeButton" onclick="window.location.href='index.html'">Retake Quiz</button>

    <script src="scripts.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const totalCorrect = localStorage.getItem('quizCorrect') || 0;
            document.getElementById('final-score').textContent = totalCorrect;
        });
    </script>
</body>
</html>
